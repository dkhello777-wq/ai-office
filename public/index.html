<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<title>AI 오피스</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<body>

<!-- 최초 비밀번호 설정 / 로그인 -->
<section id="gate" hidden>
  <div class="card">
    <div class="logo">🏢</div>
    <h1 id="gate-title">AI 오피스</h1>
    <p id="gate-hint" class="hint"></p>
    <form id="gate-form" autocomplete="on">
      <input id="f-code" name="code" autocomplete="one-time-code" placeholder="설정 코드 (서버 로그에 표시)" hidden>
      <input name="password" type="password" autocomplete="current-password" placeholder="비밀번호 (10자 이상)" required>
      <input id="f-password2" name="password2" type="password" autocomplete="new-password" placeholder="비밀번호 확인" hidden>
      <button class="btn primary" type="submit">들어가기</button>
      <span id="gate-msg" class="err"></span>
    </form>
  </div>
</section>

<div id="app" hidden>
  <header id="top">
    <div class="room">
      <div class="room-name">AI 오피스 <span id="room-count" class="count"></span></div>
      <div id="conn" class="conn">연결 중…</div>
    </div>
    <button id="stop" class="stop" title="돌고 있는 AI 전부를 즉시 멈춥니다 (끝난 답변은 그대로)" hidden>🛑 긴급 중지</button>
    <button id="people-open" class="avatars" title="참여자"></button>
    <button id="menu-open" class="icon round" title="메뉴" aria-label="메뉴"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 8h14M5 16h14"/></svg></button>
  </header>

  <main id="chat"><div id="timeline"></div></main>
  <button id="jump" class="jump" hidden>↓ 새 글</button>
  <div id="lightbox" class="lightbox" hidden><img alt=""><div class="lb-bar"><span class="lb-name"></span><a class="btn small lb-dl" download>저장</a><a class="btn small lb-open" target="_blank" rel="noopener">원본 ↗</a><button class="btn small lb-close">닫기</button></div></div>

  <footer id="composer">
    <div id="attach-row" class="attach-row" hidden></div>
    <div class="box">
      <textarea id="text" rows="1" placeholder="무엇이든 물어보세요 · @클로드 처럼 부르면 그 AI 에게만"></textarea>
      <div class="tools">
        <button type="button" id="attach-btn" class="icon round" title="파일 첨부" aria-label="파일 첨부"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><input id="upload" class="sr" type="file" multiple tabindex="-1" aria-hidden="true">
        <div id="route" class="route">
          <button id="route-all" class="chip on" title="연결된 AI 전부에게 동시에 보냄">모두에게</button>
          <button id="route-lead" class="chip" title="팀장이 받아서 팀원에게 나누고 종합">팀장에게</button>
          <span id="route-hint" class="route-hint"></span>
        </div>
        <button id="send" class="send" title="보내기 (Enter)" aria-label="보내기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V6M6 11l6-6 6 6"/></svg></button>
      </div>
    </div>
  </footer>
</div>

<!-- 참여자 (연결한 AI) -->
<dialog id="people" class="sheet">
  <div class="sheet-head"><b>참여자</b><span class="hint">구독 중인 AI 를 연결하면 이 방에 들어옵니다</span><button class="icon close" data-close="people">✕</button></div>
  <div id="people-list"></div>
</dialog>

<!-- 메뉴 -->
<dialog id="menu" class="sheet">
  <div class="sheet-head"><b>메뉴</b><button class="icon close" data-close="menu">✕</button></div>
  <div class="menu-list">
    <button id="m-memory">🧠 메모리 <small id="memory-badge"></small></button>
    <button id="m-push">🔔 알림 <small id="push-badge"></small></button>
    <button id="m-files">📁 파일함 · 드라이브 <small id="files-badge"></small></button>
    <button id="m-budget">📊 토큰 예산 <small id="budget-badge"></small></button>
    <button id="m-room">💬 방 대화 공유 <small id="room-badge"></small></button>
    <button id="m-storage">💽 저장 공간 <small id="storage-badge"></small></button>
    <button id="m-clear">🧹 방 비우기 <small>대화 기록 삭제 · AI 새 대화</small></button>
    <button id="m-auth">🔄 인증 상태 다시 확인</button>
    <button id="m-password">🔑 비밀번호 변경</button>
    <button id="m-logout">🚪 로그아웃</button>
  </div>
</dialog>

<dialog id="memory" class="sheet">
  <div class="sheet-head"><b>메모리</b><span class="hint">모든 메시지 앞에 붙습니다 (memory.md)</span><button class="icon close" data-close="memory">✕</button></div>
  <textarea id="memory-text" rows="14" placeholder="# 나에 대해&#10;- 답은 한국어로&#10;- 내 사업: ..."></textarea>
  <div class="row end"><span id="memory-info" class="hint"></span><button id="memory-save" class="btn primary">저장</button></div>
</dialog>

<dialog id="push" class="sheet">
  <div class="sheet-head"><b>알림</b><span class="hint">화면을 안 보고 있을 때만 폰으로 알려요</span><button class="icon close" data-close="push">✕</button></div>
  <div id="push-body"></div>
</dialog>

<dialog id="files" class="sheet">
  <div class="sheet-head"><b>파일함</b><span class="hint">AI 가 shared 폴더에서 직접 읽습니다</span><button class="icon close" data-close="files">✕</button></div>
  <div id="gdrive-bar" class="gdrive"></div>
  <ul id="filelist"></ul>
</dialog>

<dialog id="budget" class="sheet">
  <div class="sheet-head"><b>토큰 예산</b><button class="icon close" data-close="budget">✕</button></div>
  <p id="budget-now" class="hint"></p>
  <div id="budget-table"></div>
  <div class="row"><input id="budget-in" type="number" min="0" step="10000" placeholder="월 상한 (비우면 무제한)"><button id="budget-save" class="btn primary">저장</button></div>
  <p class="hint small">상한에 닿으면 CLI 를 띄우기 전에 차단합니다. usage 를 안 주는 CLI 는 0 으로 잡혀 보조 수단일 뿐입니다.</p>
</dialog>

<dialog id="password" class="sheet">
  <div class="sheet-head"><b>비밀번호 변경</b><button class="icon close" data-close="password">✕</button></div>
  <form id="password-form">
    <input name="current" type="password" autocomplete="current-password" placeholder="현재 비밀번호" required>
    <input name="next" type="password" autocomplete="new-password" placeholder="새 비밀번호 (10자 이상)" required>
    <div class="row end"><span id="password-msg" class="err"></span><button class="btn primary" type="submit">변경 (모든 기기 재로그인)</button></div>
  </form>
</dialog>

<script src="/order.js"></script>
<script src="/app.js"></script>
</body>
</html>
